# Config cho web demo dots.mocr (ocrbench serve). Mục dots_mocr chép NGUYÊN từ configs/kaggle_example.yaml.
# dataset/output_dir không dùng khi demo (chỉ để config hợp lệ).
# Riêng cho web demo (benchmark KHÔNG dùng): phóng ảnh nhỏ (cạnh dài < 1000 px → 1500 px, tối đa ×3) và giới hạn
# token theo kích thước ảnh — ảnh nhỏ độ phân giải thấp (vd. bảng 245×90 px) từng làm dots chạy vòng 24.000 token (~40 phút). Hệ số 8: ảnh bảng nhỏ bị tách thành nhiều khối (mỗi khối ~20 token toạ độ) — hệ số 4 làm cắt mất dòng cuối.
dataset: inference/khong_dung.jsonl
output_dir: /kaggle/working/inference_runs
models:
- name: dots_mocr
  adapter: dots
  params:
    model_id: dots-studio/dots.mocr
    prompt_mode: prompt_layout_all_en
    fitz_preprocess: false
    # ảnh nhỏ hơn 5 MP được phóng lên tới cỡ đó trước khi đưa vào dots (ảnh to hơn giữ nguyên). Ảnh WhatsApp
    # 1031×1600 (1,65 MP) đọc ở cỡ gốc: lặp sau ~2.400 token, ra 2 khối, mất cả nửa dưới trang. Phóng lên 2,8–3,9 MP
    # đã hết lặp (20–27 khối) nhưng khung form viết tay còn gộp dòng / đè chữ ký; 5 MP: 36 khối, khung khớp từng
    # dòng. repetition_penalty 1.05 hay temperature 0.1 KHÔNG chữa được (vẫn lặp). Đừng tăng: 6,6 MP hết VRAM T4.
    # Cả test_infer/: bảng 245×90 hết JSON hỏng + đọc đúng; trang PDF 200 DPI (3,6–4,2 MP) bị phóng nhẹ → chậm ~16%.
    # Đừng đặt max_pixels = min_pixels: smart_resize làm tròn lên khi phóng → vượt max → bbox lệch ~1,5%.
    min_pixels: 5000000
    max_new_tokens: 24000
    stop_on_loop: true
    loop_long_max_period: 256   # bắt cả dòng dài bị lặp (ảnh giấy tờ cũ: dòng Ả Rập ~100 token lặp tới hết token, ~25 phút)
    repair_truncated: true      # trang bị dừng giữa chừng: giữ khối cuối (bỏ phần lặp) thay vì mất cả khối
    max_time: 600               # tối đa 10 phút sinh mỗi trang: một trang hỏng không chặn hàng đợi của web quá lâu
    # Form điền tay: dots có lúc sinh dãy khung cùng cột, cao bằng nhau, cách đều rồi CHÉP chữ / số giữa các dòng
    # (ảnh thật: "1983 02081" ở 3 ô, "מר (ה) 3/7/1983" ở 3 ô). Bật: phóng to riêng vùng đó (2 MP) dựng lại bố cục →
    # đọc đúng số căn cước / ngày, hết chép, +~65 giây CHỈ trên trang bị (trang thường không đổi). Khối vẫn lặp ≥ 3
    # lần → ghi chú "cần soát". Đã thử và loại: repetition_penalty 1.05 (vẫn chép), 3,5 MP (lặp thật, mất nửa form).
    zoom_repeats: true
    modes:
      Bố cục đầy đủ: {}
      Chỉ chữ:
        prompt_mode: prompt_ocr
      Chỉ bố cục (không chữ):
        prompt_mode: prompt_layout_only_en
    preprocess:
      flatten: false
      contrast: false
      deskew: false
      upscale: true
      upscale_below: 1000
      upscale_to: 1500
      upscale_max_factor: 3.0
    adaptive_max_tokens: 8
