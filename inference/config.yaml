# Config cho web demo dots.mocr (ocrbench serve). Mục dots_mocr chép NGUYÊN từ configs/kaggle_example.yaml.
# dataset/output_dir không dùng khi demo (chỉ để config hợp lệ).
# Riêng cho web demo (benchmark KHÔNG dùng): phóng ảnh nhỏ (cạnh dài < 1000 px → 1500 px, tối đa ×3) và giới hạn
# token theo kích thước ảnh — ảnh nhỏ độ phân giải thấp (vd. bảng 245×90 px) từng làm dots chạy vòng 24.000 token (~40 phút). Hệ số 8: ảnh bảng nhỏ bị tách thành nhiều khối (mỗi khối ~20 token toạ độ) — hệ số 4 làm cắt mất dòng cuối.
dataset: inference/khong_dung.jsonl
output_dir: /kaggle/working/inference_runs
models:
- name: dots_mocr
  adapter: dots
  params:
    model_id: dots-studio/dots.mocr
    prompt_mode: prompt_layout_all_en
    fitz_preprocess: false
    max_new_tokens: 24000
    stop_on_loop: true
    modes:
      Bố cục đầy đủ: {}
      Chỉ chữ:
        prompt_mode: prompt_ocr
      Chỉ bố cục (không chữ):
        prompt_mode: prompt_layout_only_en
    preprocess:
      flatten: false
      contrast: false
      deskew: false
      upscale: true
      upscale_below: 1000
      upscale_to: 1500
      upscale_max_factor: 3.0
    adaptive_max_tokens: 8
