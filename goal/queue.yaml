# Hàng đợi model cho chế độ /goal (docs/GOAL_PROMPT.md). Chạy đúng thứ tự từ trên xuống.
# Tên phải là tên mục model trong config. Các biến thể agent tạo thêm (vd. amad_vlm6__2gpu,
# baseer__long) được tính chung cho model gốc.
#
# File này bị khóa sha256 (goal/GOAL_LOCK.sha256). Sửa xong phải tạo lại khóa:
#   ocrbench goal-check --config <config> --write-lock      (chỉ con người làm)

split: dev
max_skips: 3            # bỏ qua quá số này thì goal không đạt, agent phải dừng hỏi
max_error_rate: 0.01    # tỉ lệ mẫu lỗi tối đa để một model được coi là chạy xong
long_per_category: 12   # tài liệu dài (syn_longtable, syn_longtext): chỉ chấm 12 mẫu cố định mỗi nhóm cho mọi model
                        # (đủ 128 mẫu thì một VLM cần ~20 giờ vì tài liệu 3 trang + lặp vòng)

queue:
  - tesseract            # OCR truyền thống, CPU — mốc so sánh rẻ nhất (đã xong)
  - easyocr              # (đang chạy khi đổi thứ tự — giữ nguyên vị trí)
  - sherif_handwriting   # ƯU TIÊN: Qwen2.5-VL-3B, chữ viết tay Ả Rập–Anh
  - sherif_handwriting_pre  # = sherif + tiền xử lý ảnh (ocrbench/preprocess.py); chỉ ~24% mẫu phải chạy lại
  - qari_0_4             # ƯU TIÊN: Qwen3-VL-4B + LoRA tiếng Ả Rập
  - amad_vlm6            # ƯU TIÊN: 8,3 tỉ tham số — không vừa 1 T4 ở fp16
  - paddleocr_ar
  - paddleocr_vl         # VLM tài liệu ~0,9 tỉ tham số
  - baseer               # Qwen2-VL-2B fine-tune tiếng Ả Rập
  - hunyuan_ocr          # cần trust_remote_code; license riêng của Tencent
  - surya                # cần venv riêng
